<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #1f1f2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem;
            min-height: 100vh;
        }

        h1 {
            color: #ff4c4c;
            margin-bottom: 1rem;
            text-align: center;
        }

        .tab-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

            .tab-buttons button {
                padding: 0.5rem 1rem;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                background: #2c2c3e;
                color: #fff;
            }

                .tab-buttons button.active {
                    background: #ff4c4c;
                }

        .search-wrap {
            width: 100%;
            max-width: 700px;
            margin-bottom: 1rem;
            display: none; /* shown only on Users tab */
        }

            .search-wrap input {
                width: 100%;
                padding: 0.6rem;
                border-radius: 8px;
                border: none;
                font-size: 1rem;
            }

        .section {
            display: none;
            width: 100%;
            max-width: 700px;
        }

            .section.active {
                display: block;
            }

        .list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card {
            background: #2c2c3e;
            padding: 1rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

            .card h3 {
                margin: 0 0 0.5rem;
            }

            .card p {
                margin: 0.4rem 0;
                text-align: center;
            }

            .card button {
                background-color: #ff4c4c;
                color: #fff;
                border: none;
                padding: 0.5rem 1rem;
                border-radius: 6px;
                cursor: pointer;
                font-weight: bold;
                margin-top: 0.5rem;
            }

                .card button:hover {
                    background-color: #e03e3e;
                }

        .mods {
            margin-top: 0.75rem;
            width: 100%;
            text-align: left;
        }

            .mods p {
                margin: 0.3rem 0;
            }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: #2c2c3e;
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

            .modal-content input,
            .modal-content textarea,
            .modal-content select {
                width: 100%;
                margin-bottom: 1rem;
                padding: 0.5rem;
                border-radius: 6px;
                border: none;
                font-size: 1rem;
            }

        /* --- Modal Action Buttons --- */
        .modal-actions {
            display: flex;
            justify-content: space-between;
            gap: 0.75rem;
            width: 100%;
            margin-top: 1rem;
        }

            .modal-actions button {
                flex: 1;
                padding: 0.6rem;
                border: none;
                border-radius: 8px;
                font-weight: bold;
                cursor: pointer;
                width: auto; /* override 100% width */
            }

        .confirm-resolve {
            background-color: #28a745;
            color: #fff;
        }

            .confirm-resolve:hover {
                background-color: #218838;
            }

        .confirm-deny {
            background-color: #dc3545;
            color: #fff;
        }

            .confirm-deny:hover {
                background-color: #c82333;
            }

        #modal-cancel {
            background-color: #6c757d;
            color: #fff;
        }

            #modal-cancel:hover {
                background-color: #5a6268;
            }

        /* small helpers */
        .row {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .small {
            font-size: 0.9rem;
            color: #ddd;
        }

        .muted {
            color: #bbb
        }

        .ip-entry {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <h1>Admin Panel</h1>

    <!-- Tabs -->
    <div class="tab-buttons">
        <button id="tabUsers" class="active" onclick="showTab('users')">Users</button>
        <button id="tabBanned" onclick="showTab('banned')">Banned</button>
        <button id="tabAppeals" onclick="showTab('appeals')">Appeals</button>
        <button id="tabIpBans" onclick="showTab('ipbans')">IP Bans</button>
    </div>

    <!-- Search (Users only) -->
    <div id="searchWrap" class="search-wrap">
        <input id="searchInput" type="text" placeholder="Type a username and press Enter…" />
    </div>

    <!-- Users Section -->
    <section id="users" class="section active">
        <div id="userList" class="list"></div>
    </section>

    <!-- Banned Section -->
    <section id="banned" class="section">
        <div id="bannedList" class="list"></div>
    </section>

    <!-- Appeals Section -->
    <section id="appeals" class="section">
        <div id="appealsList" class="list"></div>
    </section>

    <!-- IP Bans Section -->
    <section id="ipbans" class="section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div class="small muted">Manage blocked IPs stored in <code>Banlist / BlockedIPs</code></div>
            <div>
                <button id="refreshIpBans" style="background:#2c2c3e;color:#fff;border:none;padding:8px 10px;border-radius:8px;cursor:pointer;margin-right:8px;">Refresh</button>
                <button id="openAddIp" style="background:#28a745;color:#fff;border:none;padding:8px 10px;border-radius:8px;cursor:pointer;">Add IP</button>
            </div>
        </div>

        <div id="blockedIpList" class="list"></div>
    </section>

    <!-- Ban Modal (existing) -->
    <div id="banModal" class="modal">
        <div class="modal-content">
            <h2>Ban User</h2>
            <textarea id="banReason" placeholder="Enter reason..." rows="3"></textarea>
            <input type="date" id="banDate" />
            <button id="confirmBan">Confirm Ban</button>
        </div>
    </div>

    <!-- Generic modal used by appeals/resolutions -->
    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button id="modal-confirm">Resolve</button>
                <button id="modal-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- IP modal (add new IP) -->
    <div id="ipModal" class="modal">
        <div class="modal-content">
            <h3 id="ipModalTitle">Add Blocked IP</h3>
            <input id="ipInput" placeholder="e.g. 203.0.113.42" />
            <input id="ipReason" placeholder="Reason (optional)" />
            <div class="modal-actions">
                <button id="ipAddConfirm" class="confirm-resolve">Add IP</button>
                <button id="ipCancel" id="modal-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // --- Firebase init ---
        const firebaseConfig = {
            apiKey: "AIzaSyBpK_RPB-mr_EuaD594bEdS5DTqKPVzflg",
            authDomain: "minecraftaddoncreator.firebaseapp.com",
            projectId: "minecraftaddoncreator",
            storageBucket: "minecraftaddoncreator.appspot.com",
            messagingSenderId: "575674413085",
            appId: "1:575674413085:web:7b52ae5d59c418002816f4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- Elements ---
        const currentUsername = localStorage.getItem("username");
        const usersSection = document.getElementById("users");
        const bannedSection = document.getElementById("banned");
        const appealsSection = document.getElementById("appeals");
        const ipbansSection = document.getElementById("ipbans");
        const userList = document.getElementById("userList");
        const bannedList = document.getElementById("bannedList");
        const appealsList = document.getElementById("appealsList");
        const blockedIpList = document.getElementById("blockedIpList");
        const searchWrap = document.getElementById("searchWrap");
        const searchInput = document.getElementById("searchInput");
        const refreshIpBans = document.getElementById("refreshIpBans");
        const openAddIp = document.getElementById("openAddIp");

        // --- Tabs ---
        function showTab(which) {
            // buttons
            document.querySelectorAll('.tab-buttons button').forEach(b => b.classList.remove('active'));
            const buttonId = which === 'ipbans' ? 'tabIpBans' : 'tab' + which.charAt(0).toUpperCase() + which.slice(1);
            const btn = document.getElementById(buttonId);
            if (btn) btn.classList.add('active');

            // sections
            [usersSection, bannedSection, appealsSection, ipbansSection].forEach(s => s.classList.remove('active'));
            document.getElementById(which).classList.add('active');
            // search visibility
            searchWrap.style.display = (which === 'users') ? 'block' : 'none';
        }

        // --- Search (press Enter to filter) ---
        function filterUsersByTerm(term) {
            const q = (term || "").toLowerCase();
            document.querySelectorAll("#userList .card").forEach(card => {
                const uname = card.getAttribute("data-username") || "";
                card.style.display = uname.includes(q) ? "flex" : "none";
            });
        }
        searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                filterUsersByTerm(searchInput.value.trim());
            }
        });

        // --- Admin gate ---
        db.collection("users").doc(currentUsername).get().then(doc => {
            const userData = doc.data();
            if (!doc.exists || !userData || userData.admin !== true) {
                document.body.innerHTML = "<h1>Access Denied</h1><p>You are not authorized to view this page.</p>";
                return;
            }
            // load data once admin is confirmed
            loadUsersAndBanned();
            loadAppeals();
            loadIpBans();
        }).catch(err => {
            console.error("admin check error", err);
            document.body.innerHTML = "<h1>Access Denied</h1><p>Auth check failed.</p>";
        });

        // --- Load Users + Banned in one pass ---
        function loadUsersAndBanned() {
            userList.innerHTML = "";
            bannedList.innerHTML = "";

            db.collection("users").get().then(snapshot => {
                snapshot.forEach(userDoc => {
                    const username = userDoc.id;
                    const data = userDoc.data();

                    // check ban subdoc
                    db.collection("users").doc(username).collection("ban").doc("info").get().then(banDoc => {
                        const isBanned = banDoc.exists;

                        // Build user card
                        const userCard = document.createElement("div");
                        userCard.className = "card";
                        userCard.setAttribute("data-username", username.toLowerCase());
                        userCard.innerHTML = `
                                  <h3>${username}</h3>
                                  <p>User ID: ${data.userId || "Unknown"}</p>
                                  <p>Status: ${isBanned ? "Banned" : "Active"}</p>
                                  <button onclick="${isBanned ? `unbanUser('${username}', this)` : `openBanModal('${username}')`}">
                                    ${isBanned ? "Unban User" : "Ban User"}
                                  </button>
                                  <div class="mods" id="mods-${username}"><em>Loading mods...</em></div>
                                `;
                        userList.appendChild(userCard);

                        // Load MODS for the user card
                        db.collection("users").doc(username).collection("MODS").get().then(modsSnapshot => {
                            const modsContainer = document.getElementById(`mods-${username}`);
                            if (modsSnapshot.empty) {
                                modsContainer.innerHTML = `<p><em>No mods found.</em></p>`;
                            } else {
                                modsContainer.innerHTML = `<strong>Mods:</strong>`;
                                modsSnapshot.forEach(modDoc => {
                                    const mod = modDoc.data();
                                    const el = document.createElement("div");
                                    el.innerHTML = `<p><strong>${mod.name || "Unnamed Mod"}</strong><br>${mod.description || "No description"}</p>`;
                                    modsContainer.appendChild(el);
                                });
                            }
                        });

                        // If banned, also add to Banned list (simpler layout)
                        if (isBanned) {
                            const bannedCard = document.createElement("div");
                            bannedCard.className = "card";
                            bannedCard.innerHTML = `
                                    <h3>${username}</h3>
                                    <p>Status: Banned</p>
                                    <button onclick="unbanUser('${username}', this)">Unban User</button>
                                  `;
                            bannedList.appendChild(bannedCard);
                        }
                    });
                });
            });
        }

        // --- Load Appeals ---
        function openModal(title, bodyHTML, onConfirm, confirmLabel = "Resolve") {
            const modal = document.getElementById("modal");
            const modalTitle = document.getElementById("modal-title");
            const modalBody = document.getElementById("modal-body");
            const confirmBtn = document.getElementById("modal-confirm");
            const cancelBtn = document.getElementById("modal-cancel");

            modalTitle.textContent = title;
            modalBody.innerHTML = bodyHTML;
            confirmBtn.textContent = confirmLabel;

            // 🔹 Reset all confirm button classes first
            confirmBtn.className = "";
            confirmBtn.classList.add(confirmLabel === "Deny" ? "confirm-deny" : "confirm-resolve");

            modal.style.display = "flex";

            confirmBtn.onclick = () => {
                if (onConfirm) onConfirm();
                modal.style.display = "none";
            };
            cancelBtn.onclick = () => {
                modal.style.display = "none";
            };
        }

        function loadAppeals() {
            appealsList.innerHTML = "";
            db.collection("appeals").orderBy("createdAt", "desc").get().then(snapshot => {
                if (snapshot.empty) {
                    appealsList.innerHTML = `<p><em>No appeals submitted.</em></p>`;
                    return;
                }

                snapshot.forEach(doc => {
                    const appeal = doc.data();
                    const created = appeal.createdAt && typeof appeal.createdAt.toDate === "function"
                        ? appeal.createdAt.toDate()
                        : (appeal.createdAt || null);
                    const when = created ? new Date(created).toLocaleString() : "Unknown date";

                    const card = document.createElement("div");
                    card.className = "card";

                    let resolvedMsg = appeal.resolvedMessage
                        ? `<p style="color:green;"><strong>${appeal.resolvedMessage}</strong></p>`
                        : "";

                    card.innerHTML = `
                    <h3>${appeal.username || "Unknown User"}</h3>
                    <p><strong>Message:</strong><br>${appeal.message || "(no message)"} </p>
                    <p><em>Submitted: ${when}</em></p>
                    ${resolvedMsg}
                    <div class="actions"></div>
                `;

                    const actionsDiv = card.querySelector(".actions");

                    if (!appeal.resolvedMessage) {
                        // Resolve button
                        const resolveBtn = document.createElement("button");
                        resolveBtn.textContent = "Resolve";
                        resolveBtn.onclick = () => {
                            openModal("Resolve Appeal", `
                            <textarea id="resolve-reason" placeholder="Enter resolution message..." style="width:100%;height:80px;"></textarea>
                        `, () => {
                                const reason = document.getElementById("resolve-reason").value.trim();
                                if (reason !== "") {
                                    const resolvedMessage = `Resolved by ${currentUsername}: ${reason}`;
                                    db.collection("appeals").doc(doc.id).update({
                                        resolvedMessage: resolvedMessage
                                    }).then(() => loadAppeals());
                                }
                            });
                        };

                        // Deny button
                        const denyBtn = document.createElement("button");
                        denyBtn.textContent = "Deny";
                        denyBtn.onclick = () => {
                            openModal("Deny Appeal", `<p>Are you sure you want to deny this appeal?</p>`, () => {
                                db.collection("appeals").doc(doc.id).delete().then(() => loadAppeals());
                            }, "Deny");
                        };

                        actionsDiv.appendChild(resolveBtn);
                        actionsDiv.appendChild(denyBtn);
                    }

                    appealsList.appendChild(card);
                });
            });
        }

        // --- Ban / Unban ---
        let selectedUser = null;
        function openBanModal(username) {
            selectedUser = username;
            document.getElementById("banModal").style.display = "flex";
        }
        document.getElementById("confirmBan").onclick = () => {
            const reason = document.getElementById("banReason").value.trim();
            const date = document.getElementById("banDate").value;
            if (!reason || !date) return;

            db.collection("users").doc(selectedUser).collection("ban").doc("info").set({
                reason,
                duration: "Permanent",
                dateIssued: date
            }).then(() => {

                db.collection("users").doc(selectedUser).set({
                    Danger: reason
                }, { merge: true });

                document.getElementById("banModal").style.display = "none";
                document.getElementById("banReason").value = "";
                document.getElementById("banDate").value = "";
                location.reload();
            });
        };
        function unbanUser(username, button) {
            db.collection("users").doc(username).collection("ban").doc("info").delete().then(() => {
                // If we're on Users tab, update the card UI
                if (button && button.parentElement) {
                    button.textContent = "Ban User";
                    button.setAttribute("onclick", `openBanModal('${username}')`);
                    const statusP = button.parentElement.querySelector("p:nth-child(3)");
                    if (statusP) statusP.textContent = "Status: Active";
                }
                // Also refresh banned list (simplest is a reload to keep everything in sync)
                location.reload();
            });
        }

        // --- IP Bans management ---
        function renderIpBans(list) {
            blockedIpList.innerHTML = "";
            if (!list || !Array.isArray(list) || list.length === 0) {
                blockedIpList.innerHTML = `<div class="card"><p><em>No blocked IPs found.</em></p></div>`;
                return;
            }

            // sort by date desc (if date present)
            list.sort((a, b) => {
                const da = a.dateAdded ? new Date(a.dateAdded).getTime() : 0;
                const dbt = b.dateAdded ? new Date(b.dateAdded).getTime() : 0;
                return dbt - da;
            });

            list.forEach(item => {
                const ip = item.IP || item.ip || "(unknown)";
                const reason = item.Reason || item.reason || "No reason provided";
                const addedBy = item.addedBy || item.addedByUser || "unknown";
                const date = item.dateAdded ? new Date(item.dateAdded).toLocaleString() : "Unknown date";

                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                        <div style="width:100%">
                          <h3 style="margin-bottom:8px">${ip}</h3>
                          <p class="small"><strong>Reason:</strong> ${reason}</p>
                          <p class="small"><strong>Added by:</strong> ${addedBy} — <strong>On:</strong> ${date}</p>
                          <div class="row" style="margin-top:8px;">
                            <button class="confirm-deny remove-ip">Remove</button>
                          </div>
                        </div>
                    `;
                // attach handler
                const removeBtn = card.querySelector(".remove-ip");
                removeBtn.addEventListener("click", () => {
                    openModal("Remove IP", `<p>Are you sure you want to remove the blocked IP <strong>${ip}</strong>?</p>`, () => {
                        removeIpBan(ip);
                    }, "Deny");
                });

                blockedIpList.appendChild(card);
            });
        }

        // load IP bans from Banlist/BlockedIPs
        function loadIpBans() {
            blockedIpList.innerHTML = `<div class="card"><p class="small">Loading blocked IPs…</p></div>`;
            db.collection("Banlist").doc("BlockedIPs").get().then(doc => {
                if (!doc.exists) {
                    renderIpBans([]);
                    return;
                }
                const data = doc.data();
                const list = data.List || [];
                renderIpBans(list);
            }).catch(err => {
                console.error("failed loading ip bans", err);
                blockedIpList.innerHTML = `<div class="card"><p class="small">Failed to load blocked IPs.</p></div>`;
            });
        }

        // Add IP ban (transactionally)
        function addIpBan(ip, reason) {
            if (!ip || ip.trim() === "") {
                alert("Please provide an IP.");
                return;
            }
            const docRef = db.collection("Banlist").doc("BlockedIPs");
            const newEntry = {
                IP: ip.trim(),
                Reason: reason || "No reason provided",
                addedBy: currentUsername || "unknown",
                dateAdded: new Date().toISOString()
            };

            db.runTransaction(transaction => {
                return transaction.get(docRef).then(docSnap => {
                    const existing = docSnap.exists ? (docSnap.data().List || []) : [];
                    // prevent duplicate IPs
                    const already = existing.some(e => (e.IP || "").trim() === newEntry.IP);
                    if (already) {
                        throw new Error("already_exists");
                    }
                    const updated = existing.concat(newEntry);
                    transaction.set(docRef, { List: updated }, { merge: true });
                    return true;
                });
            }).then(() => {
                document.getElementById("ipModal").style.display = "none";
                document.getElementById("ipInput").value = "";
                document.getElementById("ipReason").value = "";
                loadIpBans();
            }).catch(err => {
                if (err && err.message === "already_exists") {
                    alert("That IP is already blocked.");
                } else {
                    console.error("Failed to add IP:", err);
                    alert("Failed to add IP. See console for details.");
                }
            });
        }

        // Remove IP ban (transactionally)
        function removeIpBan(ip) {
            if (!ip) return;
            const docRef = db.collection("Banlist").doc("BlockedIPs");

            db.runTransaction(transaction => {
                return transaction.get(docRef).then(docSnap => {
                    if (!docSnap.exists) return; // nothing to do
                    const existing = docSnap.data().List || [];
                    const filtered = existing.filter(e => (e.IP || "").trim() !== ip.trim());
                    transaction.set(docRef, { List: filtered }, { merge: true });
                });
            }).then(() => {
                loadIpBans();
            }).catch(err => {
                console.error("Failed to remove IP:", err);
                alert("Failed to remove IP. See console for details.");
            });
        }

        // --- Wire up IP modal buttons ---
        refreshIpBans.addEventListener("click", loadIpBans);
        openAddIp.addEventListener("click", () => {
            document.getElementById("ipModal").style.display = "flex";
        });
        document.getElementById("ipCancel").addEventListener("click", () => {
            document.getElementById("ipModal").style.display = "none";
        });
        document.getElementById("ipAddConfirm").addEventListener("click", () => {
            const ip = document.getElementById("ipInput").value.trim();
            const reason = document.getElementById("ipReason").value.trim();
            addIpBan(ip, reason);
        });

        // Default to Users tab with search visible
        showTab('users');

        // Console safety note (kept from your original)
        console.log(`
                          _______      _________      _____       ______     _
                         / _____ \\    |____ ____|    / ___ \\     | ____ \\   | |
                        / /     \\_\\       | |       / /   \\ \\    | |   \\ \\  | |
                        | |               | |      / /     \\ \\   | |   | |  | |
                        \\ \\______         | |      | |     | |   | |___/ /  | |
                         \\______ \\        | |      | |     | |   |  ____/   | |
                                \\ \\       | |      | |     | |   | |        | |
                         _      | |       | |      \\ \\     / /   | |        |_|
                        \\ \\_____/ /       | |       \\ \\___/ /    | |         _
                         \\_______/        |_|        \\_____/     |_|        |_|

                         Keep your account safe! Do not send any information from
                         here to anyone or paste any text here.

                         If someone is asking you to copy or paste text here then
                         you're giving someone access to your account.
                        `);
    </script>
</body>
</html>
